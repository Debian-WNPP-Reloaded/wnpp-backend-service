name: CI/CD

on:
  push:
    branches: [trunk, master]
  pull_request:

env:
  DATABASE_URL: postgresql://udd-mirror:udd-mirror@udd-mirror.debian.net:5432/udd

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    container:
      image: golang:1.24
    steps:
      - uses: actions/checkout@v4

      - name: Run go vet
        run: go vet ./...

      # optional: golangci-lint
      # - uses: golangci/golangci-lint-action@v4
      #   with:
      #     version: latest

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    container:
      image: golang:1.24
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: go build -o backend-service ./cmd/api

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: backend-binary
          path: backend-service

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    container:
      image: golang:1.24
    steps:
      - uses: actions/checkout@v4

      - name: Dummy test step
        run: echo "No tests yet, placeholder for Postman/new tests"

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [build, test]
    env:
      SHORT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: backend-binary
          path: .

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set short SHA
        run: echo "SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ vars.DOCKERHUB_USERNAME }}/wnpp-reloaded-backend-service:latest \
            -t ${{ vars.DOCKERHUB_USERNAME }}/wnpp-reloaded-backend-service:${{ env.SHORT_SHA }} \
            .

      - name: Push Docker image
        run: |
          docker push ${{ vars.DOCKERHUB_USERNAME }}/wnpp-reloaded-backend-service:latest
          docker push ${{ vars.DOCKERHUB_USERNAME }}/wnpp-reloaded-backend-service:${{ env.SHORT_SHA }}
